name: Release model packs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: model-packs)"
        required: false
        default: "model-packs"
        type: string
  push:
    tags:
      - "model-packs"
      - "model-packs-*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build model packs
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag }}"
            if [ -z "${TAG_NAME}" ]; then
              TAG_NAME="model-packs"
            fi
          fi
          npm run -s build:model-packs -- --repo "${GITHUB_REPOSITORY}" --tag "${TAG_NAME}"

      # Rolling tags (e.g. `model-packs`) are expected to be reused. GitHub Release assets are immutable unless
      # uploaded with --clobber, so we use `gh` to overwrite existing assets in-place.
      - name: Publish GitHub Release assets (clobber)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag }}"
            if [ -z "${TAG_NAME}" ]; then
              TAG_NAME="model-packs"
            fi
          fi

          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" --title "Model packs (${TAG_NAME})" --notes ""
          fi

          # Upload each asset individually with retry/backoff to avoid GitHub "secondary rate limit"
          # when publishing packs that contain many small files (e.g. espeak-ng-data).
          shopt -s nullglob
          files=(dist/release/*)
          echo "Uploading ${#files[@]} release assets to tag ${TAG_NAME}"

          for f in "${files[@]}"; do
            echo "Uploading: ${f}"
            attempt=1
            while true; do
              set +e
              out="$(gh release upload "${TAG_NAME}" "${f}" --clobber 2>&1)"
              status=$?
              set -e

              if [ "${status}" -eq 0 ]; then
                break
              fi

              echo "${out}"

              # GitHub secondary rate limit: backoff and retry.
              if echo "${out}" | grep -qi "secondary rate limit"; then
                if [ "${attempt}" -ge 10 ]; then
                  echo "Exceeded retry budget uploading ${f}"
                  exit 1
                fi
                sleep_seconds=$((attempt * 20))
                echo "Hit secondary rate limit; sleeping ${sleep_seconds}s then retrying (attempt ${attempt}/10)"
                sleep "${sleep_seconds}"
                attempt=$((attempt + 1))
                continue
              fi

              # Any other error should fail fast (permissions, missing tag, etc.).
              echo "Upload failed for ${f}"
              exit 1
            done
          done
